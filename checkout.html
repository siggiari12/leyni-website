<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — LEYNI</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<meta name="theme-color" content="#0E0E0E" />
<link rel="stylesheet" href="styles.css?v=5" />
<style>
.co{padding-top:calc(76px + 7vh);padding-bottom:130px}
.co-grid{display:grid;grid-template-columns:1fr .8fr;gap:70px;align-items:start}
.co h1{font-size:clamp(2.2rem,4vw,3.4rem);font-weight:300;margin-bottom:6vh}
.co form .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.co label{display:block;margin-bottom:18px}
.co label .lbl{display:block;margin-bottom:8px}
.co input,.co textarea{width:100%;font:inherit;font-size:.95rem;padding:12px 14px;
  border:1px solid var(--line);border-radius:0;background:#fff;box-sizing:border-box}
.co input:focus,.co textarea:focus{outline:none;border-color:var(--ink)}
.sum{border:1px solid var(--line);padding:28px;position:sticky;top:110px}
.sum h3{font-family:var(--serif);font-weight:400;font-size:1.4rem;margin:0 0 20px}
.sum .li{display:flex;justify-content:space-between;gap:14px;font-size:.9rem;padding:10px 0;border-bottom:1px solid var(--line)}
.sum .li:first-of-type{border-top:1px solid var(--line)}
.sum .tot{display:flex;justify-content:space-between;margin-top:18px;font-size:.68rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.sum .tot span:last-child{font-family:var(--serif);font-size:1.25rem;letter-spacing:0;text-transform:none}
.paybox{background:var(--linen);padding:20px;margin-top:22px;font-size:.85rem;color:var(--ink)}
.paybox .lbl{display:block;margin-bottom:10px}
.success{max-width:620px}
.success h1{font-size:clamp(2.4rem,5vw,4rem);font-weight:300;margin-bottom:.4em}
.success .ordno{font-family:var(--serif);font-size:1.6rem;margin:.6em 0}
.err{color:#a33;font-size:.85rem;margin-top:14px;display:none}
@media(max-width:900px){.co-grid{grid-template-columns:1fr}.sum{position:static}}
</style>
</head>
<body>

<header class="nav solid">
  <div class="wrap nav-in">
    <div class="nav-l">
      <a class="link" href="shop.html" data-en="Collection" data-is="Slæðurnar">Collection</a>
    </div>
    <a href="index.html" class="wordmark" aria-label="Leyni home">LEYNI<small>SECRET NORTH</small></a>
    <div class="nav-r">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang-btn="en">EN</button><span class="sep">/</span><button data-lang-btn="is">IS</button>
      </div>
      <button class="link bag" data-open-cart aria-label="Bag">
        <svg class="bag-ico" width="17" height="19" viewBox="0 0 17 19" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M2.2 5.8h12.6l-1.05 11.9H3.25L2.2 5.8Z"/><path d="M5.6 7.6V4.4a2.9 2.9 0 0 1 5.8 0v3.2"/></svg><span class="count">0</span>
      </button>
    </div>
  </div>
</header>

<div class="wrap co" id="coWrap">
  <p class="lbl" data-en="Checkout — pay by bank transfer" data-is="Greiðsla — millifærsla">Checkout — pay by bank transfer</p>
  <h1><span data-en="Almost" data-is="Næstum">Almost</span> <em data-en="yours" data-is="komið">yours</em></h1>

  <div class="co-grid">
    <form id="coForm" onsubmit="return submitOrder(event)">
      <div class="row">
        <label><span class="lbl" data-en="Full name" data-is="Fullt nafn">Full name</span><input name="name" required minlength="2" /></label>
        <label><span class="lbl" data-en="Email" data-is="Netfang">Email</span><input name="email" type="email" required /></label>
      </div>
      <label><span class="lbl" data-en="Phone (optional)" data-is="Sími (valfrjálst)">Phone (optional)</span><input name="phone" /></label>
      <label><span class="lbl" data-en="Address" data-is="Heimilisfang">Address</span><input name="address" required minlength="2" /></label>
      <div class="row">
        <label><span class="lbl" data-en="Postal code" data-is="Póstnúmer">Postal code</span><input name="postal" required minlength="2" /></label>
        <label><span class="lbl" data-en="City" data-is="Staður">City</span><input name="city" required minlength="2" /></label>
      </div>
      <label><span class="lbl" data-en="Country" data-is="Land">Country</span><input name="country" required minlength="2" value="Iceland" /></label>
      <label><span class="lbl" data-en="Note (optional)" data-is="Athugasemd (valfrjálst)">Note (optional)</span><textarea name="note" rows="2"></textarea></label>
      <button class="btn dark block" id="coBtn" data-en="Place order" data-is="Staðfesta pöntun">Place order</button>
      <p class="err" id="coErr"></p>
      <p style="font-size:.78rem;color:var(--grey);margin-top:16px"
         data-en="No card payment yet — you will receive bank-transfer instructions with your order number. Your order ships once payment is received."
         data-is="Engin kortagreiðsla ennþá — þú færð millifærsluupplýsingar ásamt pöntunarnúmeri. Pöntunin er send þegar greiðsla hefur borist.">No card payment yet — you will receive bank-transfer instructions with your order number. Your order ships once payment is received.</p>
    </form>

    <aside class="sum">
      <h3 data-en="Your order" data-is="Pöntunin þín">Your order</h3>
      <div id="sumItems"></div>
      <div class="tot" style="margin-top:14px;font-weight:400"><span class="lbl" data-en="Shipping" data-is="Sending">Shipping</span><span id="sumShip" style="font-family:var(--sans);font-size:.85rem"></span></div>
      <div class="tot"><span data-en="Total" data-is="Samtals">Total</span><span id="sumTotal"></span></div>
    </aside>
  </div>
</div>

<script src="app.js?v=5"></script>
<script>
  function money2(n){ return money(n); }
  function cartLines(){
    return getCart().map(i=>({ ...i, p: bySlug(i.slug) })).filter(x=>x.p);
  }
  function renderSummary(){
    const lines=cartLines();
    if(!lines.length){ location.href='shop.html'; return; }
    const l=lang();
    let sub=0;
    document.getElementById('sumItems').innerHTML=lines.map(x=>{
      const cp=prod(x.slug); const unit=cp?cp.price:PRICE; const line=unit*x.qty; sub+=line;
      return `<div class="li"><span>${x.qty} × ${dispName(x.p,l)}</span><span>${money2(line)}</span></div>`;
    }).join('');
    document.getElementById('sumShip').textContent=`${SHIPPING.label} · ${money2(SHIPPING.price)}`;
    document.getElementById('sumTotal').textContent=money2(sub+SHIPPING.price);
  }
  function PAGE_RENDER(){ renderSummary(); }
  function PAGE_LANG(){ renderSummary(); }

  async function submitOrder(ev){
    ev.preventDefault();
    const f=ev.target, l=lang();
    const btn=document.getElementById('coBtn'); btn.disabled=true;
    document.getElementById('coErr').style.display='none';
    const customer=Object.fromEntries(new FormData(f).entries());
    const items=getCart().map(i=>({slug:i.slug,qty:i.qty}));
    try{
      const r=await fetch(API+'/api/orders',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({items,customer})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'error');
      setCart([]);
      document.getElementById('coWrap').innerHTML=`
        <div class="success">
          <p class="lbl" data-en="Order received" data-is="Pöntun móttekin">${l==='is'?'Pöntun móttekin':'Order received'}</p>
          <h1>${l==='is'?'Takk fyrir':'Thank you'}</h1>
          <div class="ordno">${d.orderNumber}</div>
          <p style="color:var(--grey)">${l==='is'
            ?'Greiddu samtals '+money(d.total)+' með millifærslu og skráðu pöntunarnúmerið í skýringu. Pöntunin er send þegar greiðslan hefur borist — staðfesting berst á netfangið þitt.'
            :'Please transfer '+money(d.total)+' and include your order number as the payment reference. Your order ships once payment is received — confirmation will follow by email.'}</p>
          <div class="paybox"><span class="lbl" data-en="Bank transfer details" data-is="Millifærsluupplýsingar">${l==='is'?'Millifærsluupplýsingar':'Bank transfer details'}</span>${(d.bankDetails||'').replace(/</g,'&lt;').replace(/\n/g,'<br>')}<br><br><b>${l==='is'?'Skýring':'Reference'}: ${d.orderNumber}</b></div>
          <p style="margin-top:3em"><a class="ulink" href="index.html" data-en="Back to Leyni" data-is="Aftur á forsíðu">${l==='is'?'Aftur á forsíðu':'Back to Leyni'}</a></p>
        </div>`;
      window.scrollTo(0,0);
    }catch(e){
      btn.disabled=false;
      const el=document.getElementById('coErr');
      el.textContent=(l==='is'?'Villa: ':'Error: ')+e.message;
      el.style.display='block';
    }
    return false;
  }
</script>
</body>
</html>
